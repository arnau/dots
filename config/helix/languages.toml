[[language]]
name = "csv"
scope = "source.csv"
file-types = ["csv"]
comment-token = "#"
indent = { tab-width = 2, unit = "  " }
roots = []

[[grammar]]
name = "csv"
source = { git = "https://github.com/arnau/tree-sitter-csv", rev = "main" }


[[language]]
name = "lua"
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = ["test"]

[[language]]
name = "nu"
auto-format = true
indent = { tab-width = 4, unit = "    " }

[[grammar]]
name = "nu"
source = { git = "https://github.com/nushell/tree-sitter-nu", rev = "main" }
